<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FarmTracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>FarmTracker</h1>
    <nav>
      <a href="index.html" class="active">Paddocks</a>
      <a href="animals.html">Animals</a>
    </nav>
  </header>
  <main>
    <div class="page-header">
      <h2>Paddocks</h2>
    </div>
    <div id="paddocks-error" class="error-banner" hidden></div>
    <div id="paddocks-grid" class="card-grid">
      <p class="loading">Loading…</p>
    </div>
  </main>
  <script src="app.js"></script>
  <script>
    async function loadPaddocks() {
      const grid = document.getElementById('paddocks-grid');
      const errorBanner = document.getElementById('paddocks-error');
      errorBanner.hidden = true;
      errorBanner.textContent = '';
      grid.innerHTML = '<p class="loading">Loading...</p>';

      let paddocks;
      try {
        paddocks = await api.get('/paddocks');
      } catch (err) {
        errorBanner.textContent = err.message || 'Failed to load paddocks.';
        errorBanner.hidden = false;
        grid.innerHTML = '<p class="empty">Unable to load paddocks.</p>';
        return;
      }

      if (!paddocks.length) {
        grid.innerHTML = '<p class="empty">No paddocks found.</p>';
        return;
      }

      grid.innerHTML = paddocks.map(p => `
        <div class="card">
          <h3>${escapeHtml(p.name)}</h3>
          <p class="stat">${escapeHtml(p.animal_count)} / ${escapeHtml(p.capacity)} animals</p>
          <div class="capacity-bar">
            <div class="capacity-fill" style="width: ${Math.min(100, Math.round((p.animal_count / p.capacity) * 100))}%"></div>
          </div>
        </div>
      `).join('');
    }

    loadPaddocks();
  </script>
</body>
</html>
